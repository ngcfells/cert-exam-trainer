# Cloudflare Worker that turns in-app reports into GitHub issues.
# Secrets (GITHUB_TOKEN, TURNSTILE_SECRET) are set with `npx wrangler secret put`, never in this file.
name = "cert-trainer-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "RELAY_KV"
id = "7c75179187e84023b6de311d938b9714"
